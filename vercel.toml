"$schema" = "https://openapi.vercel.sh/vercel.json"

[services.frontend]
root = "frontend/"
framework = "nextjs"

[[services.frontend.bindings]]
type = "service"
service = "backend"
format = "url"
env = "BACKEND_URL"

[services.backend]
root = "backend/"
runtime = "container"
entrypoint = "Dockerfile"

[[rewrites]]
source = "/api"
destination = { service = "backend" }

[[rewrites]]
source = "/api/(.*)"
destination = { service = "backend" }

[[rewrites]]
source = "/(.*)"
destination = { service = "frontend" }
